<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="1200" height="630" fill="#0a0a0f"/>

  <!-- Gradient accent -->
  <defs>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a8af4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2dd4a0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accentGradient)"/>

  <!-- Logo/Icon area -->
  <text x="80" y="120" font-family="monospace" font-size="72" font-weight="bold" fill="#4a8af4">$</text>

  <!-- Main heading -->
  <text x="80" y="240" font-family="Inter, sans-serif" font-size="72" font-weight="700" fill="#ededf0">
    dbpeek
  </text>

  <!-- Tagline -->
  <text x="80" y="320" font-family="Inter, sans-serif" font-size="48" font-weight="400" fill="#8a8a9a">
    Database explorer.
  </text>
  <text x="80" y="380" font-family="Inter, sans-serif" font-size="48" font-weight="400" fill="#8a8a9a">
    Zero install. Zero persistence.
  </text>

  <!-- Command example -->
  <rect x="80" y="440" width="1040" height="120" rx="8" fill="#111118" stroke="#1e1e2e" stroke-width="2"/>
  <text x="110" y="485" font-family="monospace" font-size="32" fill="#4a8af4" font-weight="600">$</text>
  <text x="160" y="485" font-family="monospace" font-size="32" fill="#ededf0">npx dbpeek</text>
  <text x="110" y="535" font-family="monospace" font-size="28" fill="#2dd4a0">"postgres://user:pass@localhost:5432/mydb"</text>
</svg>
